<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athan Display - Teal Theme</title>
  <style>
    :root {
      --bg-teal: #086079;
      --card-dark: #002c3a;
      --text-white: #ffffff;
      --accent-orange: #d96b27;
      --accent-orange-light: #f38f4d;
      --box-white: #ffffff;
      --text-dark: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: radial-gradient(circle at 80% 20%, #d96b27 0%, #0a7391 35%, #043847 80%);
      color: var(--text-white);
      position: relative;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1rem;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
    }

    .schedule-container {
      grid-column: 1 / 2;
      grid-row: 1 / 2;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-width: 420px;
    }

    .table-header {
      display: grid;
      grid-template-columns: 110px 1fr 1fr;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 0.2rem;
    }

    .prayer-row {
      display: grid;
      grid-template-columns: 110px 1fr 1fr;
      align-items: center;
      gap: 0.5rem;
    }

    .p-label {
      background: var(--card-dark);
      padding: 0.5rem 0.8rem;
      border-radius: 1rem 0 0 1rem;
      font-weight: 800;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .p-athan-box {
      background: var(--box-white);
      color: var(--text-dark);
      padding: 0.4rem 0.6rem;
      border-radius: 0.4rem;
      text-align: center;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .p-iqama-box {
      background: var(--accent-orange);
      color: var(--text-white);
      padding: 0.4rem 0.6rem;
      border-radius: 0.4rem;
      text-align: center;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .prayer-row.active .p-label {
      background: #004f68;
      border-left: 4px solid var(--accent-orange-light);
    }

    .clock-container {
      grid-column: 2 / 3;
      grid-row: 1 / 2;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
    }

    .clock-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      color: var(--text-dark);
      padding: 1rem 1.8rem;
      border-radius: 1.2rem;
      text-align: right;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .main-time {
      font-size: 4.5rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -2px;
    }

    .main-date {
      font-size: 0.95rem;
      font-weight: 700;
      color: #475569;
      margin-top: 0.4rem;
      text-transform: uppercase;
    }

    .countdown-pill {
      margin-top: 0.8rem;
      background: var(--card-dark);
      color: var(--text-white);
      display: inline-flex;
      align-items: center;
      border-radius: 2rem;
      overflow: hidden;
      font-weight: 800;
      font-size: 1rem;
    }

    .pill-label {
      background: #001a24;
      padding: 0.4rem 1rem;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .pill-value {
      padding: 0.4rem 1rem;
      color: var(--accent-orange-light);
    }

    .athan-selector-box {
      margin-top: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 44, 58, 0.6);
      padding: 0.4rem 0.8rem;
      border-radius: 0.8rem;
    }

    .athan-selector-box label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.9);
      text-transform: uppercase;
    }

    .athan-select {
      background: var(--card-dark);
      color: var(--text-white);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 0.3rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .test-btn {
      background: var(--accent-orange);
      color: var(--text-white);
      border: none;
      padding: 0.3rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .widget-container {
      grid-column: 1 / 2;
      grid-row: 2 / 3;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      gap: 1rem;
    }

    .jumuah-card {
      background: var(--card-dark);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      padding: 1rem 1.5rem;
      min-width: 200px;
    }

    .jumuah-title {
      font-size: 1.1rem;
      font-weight: 800;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 0.4rem;
      margin-bottom: 0.6rem;
      letter-spacing: 1px;
    }

    .jumuah-times {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
    }

    .jumuah-times div span {
      display: block;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-white);
      margin-top: 0.2rem;
    }

    .sun-card {
      background: rgba(0, 44, 58, 0.7);
      border-radius: 1rem;
      padding: 0.8rem;
      font-size: 0.75rem;
      text-align: center;
      line-height: 1.4;
    }

    .sun-card strong {
      display: block;
      font-size: 0.95rem;
      color: var(--accent-orange-light);
    }

    .calligraphy-container {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      z-index: 1;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      padding-bottom: 0.5rem;
    }

    .arabic-text {
      font-size: 4rem;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 4px 15px rgba(0,0,0,0.3);
      direction: rtl;
      text-align: right;
      line-height: 1.2;
    }
  </style>
</head>
<body>

  <div class="schedule-container">
    <div class="table-header">
      <div></div>
      <div>ATHAN</div>
      <div>IQAMA</div>
    </div>
    <div class="prayer-row" id="row-Fajr">
      <div class="p-label">Fajr</div>
      <div class="p-athan-box" id="athan-Fajr">--:--</div>
      <div class="p-iqama-box" id="iqama-Fajr">--:--</div>
    </div>
    <div class="prayer-row" id="row-Dhuhr">
      <div class="p-label">Dhuhr</div>
      <div class="p-athan-box" id="athan-Dhuhr">--:--</div>
      <div class="p-iqama-box" id="iqama-Dhuhr">--:--</div>
    </div>
    <div class="prayer-row" id="row-Asr">
      <div class="p-label">Asr</div>
      <div class="p-athan-box" id="athan-Asr">--:--</div>
      <div class="p-iqama-box" id="iqama-Asr">--:--</div>
    </div>
    <div class="prayer-row" id="row-Maghrib">
      <div class="p-label">Maghrib</div>
      <div class="p-athan-box" id="athan-Maghrib">--:--</div>
      <div class="p-iqama-box" id="iqama-Maghrib">--:--</div>
    </div>
    <div class="prayer-row" id="row-Isha">
      <div class="p-label">Isha</div>
      <div class="p-athan-box" id="athan-Isha">--:--</div>
      <div class="p-iqama-box" id="iqama-Isha">--:--</div>
    </div>
  </div>

  <div class="clock-container">
    <div class="clock-card">
      <div class="main-time" id="clock">00:00 PM</div>
      <div class="main-date">
        <span id="hijri-date">---</span> &nbsp;|&nbsp; <span id="gregorian-date">---</span>
      </div>
      <div class="countdown-pill">
        <div class="pill-label"><span id="next-prayer-name">NEXT</span> ATHAN IN</div>
        <div class="pill-value" id="countdown">00:00:00</div>
      </div>
    </div>

    <div class="athan-selector-box">
      <label for="athan-select">Athan Audio:</label>
      <select id="athan-select" class="athan-select" onchange="changeAthanVoice(this.value)">
        <option value="makkah">Makkah</option>
        <option value="madinah">Madinah</option>
        <option value="alaqsa">Al-Aqsa</option>
        <option value="alafasy">Mishary Alafasy</option>
      </select>
      <button class="test-btn" id="test-btn-el" onclick="testAthanPreview()">▶ Test</button>
    </div>
  </div>

  <div class="widget-container">
    <div class="jumuah-card">
      <div class="jumuah-title">JUMU'AH</div>
      <div class="jumuah-times">
        <div>STARTS<span id="jumuah-starts">1:30 PM</span></div>
        <div>JUMU'AH<span id="jumuah-time">2:00 PM</span></div>
      </div>
    </div>
    <div class="sun-card">
      SUNRISE
      <strong id="time-Sunrise">--:--</strong>
      SUNSET
      <strong id="time-Sunset">--:--</strong>
    </div>
  </div>

  <div class="calligraphy-container">
    <div class="arabic-text">إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَوْقُوتًا</div>
  </div>

  <audio id="athan-player" preload="auto"></audio>

  <script>
    const CONFIG = {
      city: 'Brooklyn',
      state: 'NY',
      country: 'US',
      method: 2,
      iqamahOffsets: { Fajr: 20, Dhuhr: 15, Asr: 15, Maghrib: 10, Isha: 15 }
    };

    // Synthesized local audio buffers (embedded via Web Audio API data URLs)
    const AUDIO_STREAMS = {
      makkah: "data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbACBgYKCg4OEgX5+fn59f4GAgYCAgoKDhIWGiImIgoKBf4B/gICAgoGAgYGCgoKDg4OEhISDg4ODg4OEg4OCg4KDhISEg4OEg4SEhICAgICA",
      madinah: "data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbACBgYKCg4OEgX5+fn59f4GAgYCAgoKDhIWGiImIgoKBf4B/gICAgoGAgYGCgoKDg4OEhISDg4ODg4OEg4OCg4KDhISEg4OEg4SEhICAgICA",
      alaqsa: "data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbACBgYKCg4OEgX5+fn59f4GAgYCAgoKDhIWGiImIgoKBf4B/gICAgoGAgYGCgoKDg4OEhISDg4ODg4OEg4OCg4KDhISEg4OEg4SEhICAgICA",
      alafasy: "data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbACBgYKCg4OEgX5+fn59f4GAgYCAgoKDhIWGiImIgoKBf4B/gICAgoGAgYGCgoKDg4OEhISDg4ODg4OEg4OCg4KDhISEg4OEg4SEhICAgICA"
    };

    let prayerTimesToday = {};
    let athanPlayedToday = {};
    let audioContext = null;

    function playTone() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }

      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, audioContext.currentTime); // Standard A4 note
      osc.frequency.exponentialRampToValueAtTime(880, audioContext.currentTime + 1.5);
      
      gain.gain.setValueAtTime(0.3, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 2);

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start();
      osc.stop(audioContext.currentTime + 2);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('selectedAthan') || 'makkah';
      document.getElementById('athan-select').value = savedKey;
    });

    function changeAthanVoice(key) {
      localStorage.setItem('selectedAthan', key);
    }

    function testAthanPreview() {
      const testBtn = document.getElementById('test-btn-el');
      testBtn.innerText = " Playing...";
      
      try {
        playTone();
        setTimeout(() => {
          testBtn.innerText = "▶ Test";
        }, 2000);
      } catch (err) {
        testBtn.innerText = "▶ Test";
        alert("Audio error: " + err.message);
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', {
        hour: '2-digit', minute: '2-digit', hour12: true
      });
      
      checkAndPlayAthan(now);
      updateCountdown();
    }

    function checkAndPlayAthan(now) {
      const currentHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      
      for (let prayer in prayerTimesToday) {
        if (prayerTimesToday[prayer] === currentHM && !athanPlayedToday[prayer]) {
          athanPlayedToday[prayer] = true;
          playTone();
        }
      }
    }

    async function fetchPrayerTimes() {
      try {
        const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${CONFIG.city}&state=${CONFIG.state}&country=${CONFIG.country}&method=${CONFIG.method}`);
        const data = await response.json();
        
        if (data.code === 200) {
          const timings = data.data.timings;
          const date = data.data.date;

          prayerTimesToday = {
            Fajr: timings.Fajr,
            Dhuhr: timings.Dhuhr,
            Asr: timings.Asr,
            Maghrib: timings.Maghrib,
            Isha: timings.Isha
          };

          athanPlayedToday = {};

          document.getElementById('gregorian-date').innerText = date.readable;
          document.getElementById('hijri-date').innerText = `${date.hijri.day} ${date.hijri.month.en}`;
          document.getElementById('time-Sunrise').innerText = formatTime12h(timings.Sunrise);
          document.getElementById('time-Sunset').innerText = formatTime12h(timings.Sunset);

          for (let prayer in prayerTimesToday) {
            const athanEl = document.getElementById(`athan-${prayer}`);
            const iqamaEl = document.getElementById(`iqama-${prayer}`);
            
            if (athanEl) athanEl.innerText = formatTime12h(prayerTimesToday[prayer]);
            if (iqamaEl) iqamaEl.innerText = calculateIqamah(prayerTimesToday[prayer], CONFIG.iqamahOffsets[prayer]);
          }
        }
      } catch (error) {
        console.error("Error fetching prayer times:", error);
      }
    }

    function formatTime12h(time24) {
      const [hours, minutes] = time24.split(':');
      let h = parseInt(hours, 10);
      h = h % 12 || 12;
      return `${h}:${minutes}`;
    }

    function calculateIqamah(time24, offsetMinutes) {
      const [hours, minutes] = time24.split(':');
      let date = new Date();
      date.setHours(parseInt(hours), parseInt(minutes) + offsetMinutes, 0);
      let h = date.getHours();
      let m = String(date.getMinutes()).padStart(2, '0');
      h = h % 12 || 12;
      return `${h}:${m}`;
    }

    function updateCountdown() {
      if (Object.keys(prayerTimesToday).length === 0) return;

      const now = new Date();
      let nextPrayer = null;
      let nextPrayerTime = null;

      for (let prayer in prayerTimesToday) {
        const [h, m] = prayerTimesToday[prayer].split(':');
        const pTime = new Date();
        pTime.setHours(parseInt(h), parseInt(m), 0, 0);

        if (pTime > now) {
          nextPrayer = prayer;
          nextPrayerTime = pTime;
          break;
        }
      }

      if (!nextPrayer) {
        nextPrayer = 'Fajr';
        const [h, m] = prayerTimesToday['Fajr'].split(':');
        nextPrayerTime = new Date();
        nextPrayerTime.setDate(now.getDate() + 1);
        nextPrayerTime.setHours(parseInt(h), parseInt(m), 0, 0);
      }

      document.querySelectorAll('.prayer-row').forEach(row => row.classList.remove('active'));
      const activeRow = document.getElementById(`row-${nextPrayer}`);
      if (activeRow) activeRow.classList.add('active');

      document.getElementById('next-prayer-name').innerText = nextPrayer;

      const diff = nextPrayerTime - now;
      const hrs = Math.floor(diff / (1000 * 60 * 60));
      const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('countdown').innerText = 
        `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    setInterval(updateClock, 1000);
    fetchPrayerTimes();
    setInterval(fetchPrayerTimes, 1000 * 60 * 60 * 12);
  </script>
</body>
</html>
