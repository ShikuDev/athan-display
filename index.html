<!-- Hidden Audio Player -->
<audio id="athan-player" preload="auto">
  <source src="https://cdn.aladhan.com/athan/Mecca.mp3" type="audio/mpeg">
</audio>

<script>
  const CONFIG = {
    city: 'Brooklyn',
    state: 'NY',
    country: 'US',
    method: 2, // ISNA
    iqamahOffsets: { Fajr: 20, Dhuhr: 15, Asr: 15, Maghrib: 10, Isha: 15 }
  };

  let prayerTimesToday = {};
  let athanPlayedToday = {}; // Tracks played athans so it doesn't loop
  let audioUnlocked = false;

  // Unlock audio playback on first user tap/click anywhere on the screen
  document.body.addEventListener('click', () => {
    if (!audioUnlocked) {
      const audio = document.getElementById('athan-player');
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        audioUnlocked = true;
        console.log("Audio Unlocked for Automatic Athan");
      }).catch(e => console.log(e));
    }
  }, { once: true });

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', {
      hour: '2-digit', minute: '2-digit', hour12: true
    });
    
    checkAndPlayAthan(now);
    updateCountdown();
  }

  function checkAndPlayAthan(now) {
    const currentHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    
    for (let prayer in prayerTimesToday) {
      if (prayerTimesToday[prayer] === currentHM && !athanPlayedToday[prayer]) {
        athanPlayedToday[prayer] = true; // Mark as played for today
        playAthanAudio();
      }
    }
  }

  function playAthanAudio() {
    const audio = document.getElementById('athan-player');
    if (audio) {
      audio.currentTime = 0;
      audio.play().catch(err => console.error("Audio playback blocked:", err));
    }
  }

  async function fetchPrayerTimes() {
    try {
      const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${CONFIG.city}&state=${CONFIG.state}&country=${CONFIG.country}&method=${CONFIG.method}`);
      const data = await response.json();
      
      if (data.code === 200) {
        const timings = data.data.timings;
        const date = data.data.date;

        prayerTimesToday = {
          Fajr: timings.Fajr,
          Dhuhr: timings.Dhuhr,
          Asr: timings.Asr,
          Maghrib: timings.Maghrib,
          Isha: timings.Isha
        };

        // Reset daily playback tracker
        athanPlayedToday = {};

        document.getElementById('gregorian-date').innerText = date.readable;
        document.getElementById('hijri-date').innerText = `${date.hijri.day} ${date.hijri.month.en}`;
        document.getElementById('time-Sunrise').innerText = formatTime12h(timings.Sunrise);
        document.getElementById('time-Sunset').innerText = formatTime12h(timings.Sunset);

        for (let prayer in prayerTimesToday) {
          const athanEl = document.getElementById(`athan-${prayer}`);
          const iqamaEl = document.getElementById(`iqama-${prayer}`);
          
          if (athanEl) athanEl.innerText = formatTime12h(prayerTimesToday[prayer]);
          if (iqamaEl) iqamaEl.innerText = calculateIqamah(prayerTimesToday[prayer], CONFIG.iqamahOffsets[prayer]);
        }
      }
    } catch (error) {
      console.error("Error fetching prayer times:", error);
    }
  }

  function formatTime12h(time24) {
    const [hours, minutes] = time24.split(':');
    let h = parseInt(hours, 10);
    h = h % 12 || 12;
    return `${h}:${minutes}`;
  }

  function calculateIqamah(time24, offsetMinutes) {
    const [hours, minutes] = time24.split(':');
    let date = new Date();
    date.setHours(parseInt(hours), parseInt(minutes) + offsetMinutes, 0);
    let h = date.getHours();
    let m = String(date.getMinutes()).padStart(2, '0');
    h = h % 12 || 12;
    return `${h}:${m}`;
  }

  function updateCountdown() {
    if (Object.keys(prayerTimesToday).length === 0) return;

    const now = new Date();
    let nextPrayer = null;
    let nextPrayerTime = null;

    for (let prayer in prayerTimesToday) {
      const [h, m] = prayerTimesToday[prayer].split(':');
      const pTime = new Date();
      pTime.setHours(parseInt(h), parseInt(m), 0, 0);

      if (pTime > now) {
        nextPrayer = prayer;
        nextPrayerTime = pTime;
        break;
      }
    }

    if (!nextPrayer) {
      nextPrayer = 'Fajr';
      const [h, m] = prayerTimesToday['Fajr'].split(':');
      nextPrayerTime = new Date();
      nextPrayerTime.setDate(now.getDate() + 1);
      nextPrayerTime.setHours(parseInt(h), parseInt(m), 0, 0);
    }

    document.querySelectorAll('.prayer-row').forEach(row => row.classList.remove('active'));
    const activeRow = document.getElementById(`row-${nextPrayer}`);
    if (activeRow) activeRow.classList.add('active');

    document.getElementById('next-prayer-name').innerText = nextPrayer;

    const diff = nextPrayerTime - now;
    const hrs = Math.floor(diff / (1000 * 60 * 60));
    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const secs = Math.floor((diff % (1000 * 60)) / 1000);

    document.getElementById('countdown').innerText = 
      `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }

  setInterval(updateClock, 1000);
  fetchPrayerTimes();
  setInterval(fetchPrayerTimes, 1000 * 60 * 60 * 12);
</script>
