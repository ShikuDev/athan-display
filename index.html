<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athan Clock Display</title>
  <style>
    :root {
      /* Dark Tones & Sleek UI Palette */
      --bg-dark: #0a0c10;
      --card-bg: #141720;
      --card-highlight: #1e2530;
      --accent-main: #38bdf8; /* Vibrant light blue */
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #2e3b4e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      /* Subtle brushed metal texture overlay */
      background-image: 
        repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 4px),
        linear-gradient(to bottom, #111, #000);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
    }

    /* Animated Arabic Writing Layer */
    .arabic-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 10rem;
      color: rgba(255, 255, 255, 0.03); /* Extremely faint */
      font-weight: 900;
      white-space: nowrap;
      pointer-events: none;
      animation: ArabicPulse 8s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes ArabicPulse {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.8; color: rgba(255, 255, 255, 0.15); }
    }

    /* Main Compact UI Container */
    .dashboard {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 1.5rem;
      width: 90%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 2fr 3fr; /* Balanced layout */
      gap: 1.5rem;
      padding: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
      z-index: 10;
    }

    /* Left Section: Next Prayer & Countdown */
    .next-prayer-group {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--border-color);
      padding-right: 1.5rem;
    }

    .status-badge {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent-main);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }

    .next-prayer-name {
      font-size: 4.5rem;
      font-weight: 900;
      color: var(--text-main);
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .compact-countdown {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 0.5rem;
    }

    /* Right Section: Timings & Clock */
    .details-group {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Compact 5-Prayer List */
    .prayer-list {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.75rem;
    }

    .p-item {
      background: var(--card-highlight);
      border-radius: 0.75rem;
      padding: 0.75rem;
      text-align: center;
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }

    .p-item.active {
      border-color: var(--accent-main);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .p-item.active .p-name { color: var(--accent-main); }

    .p-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .p-time {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* Compact Digital Clock & Date */
    .bottom-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      border-top: 1px solid var(--border-color);
      padding-top: 0.75rem;
    }

    .digital-clock {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent-main);
      line-height: 1;
    }

    .date-info {
      text-align: right;
      font-size: 1rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

  </style>
</head>
<body>

  <div class="arabic-overlay">ٱلصَّلَوٰةَ</div>

  <div class="dashboard">
    <div class="next-prayer-group">
      <div>
        <div class="status-badge">Next Prayer</div>
        <div class="next-prayer-name" id="next-prayer-name">Asr</div>
      </div>
      <div class="compact-countdown" id="countdown">00:00:00</div>
    </div>

    <div class="details-group">
      <div class="prayer-list">
        <div class="p-item" id="card-Fajr"><div class="p-name">Fajr</div><div class="p-time" id="time-Fajr">--:--</div></div>
        <div class="p-item" id="card-Dhuhr"><div class="p-name">Dhuhr</div><div class="p-time" id="time-Dhuhr">--:--</div></div>
        <div class="p-item" id="card-Asr"><div class="p-name">Asr</div><div class="p-time" id="time-Asr">--:--</div></div>
        <div class="p-item" id="card-Maghrib"><div class="p-name">Maghrib</div><div class="p-time" id="time-Maghrib">--:--</div></div>
        <div class="p-item" id="card-Isha"><div class="p-name">Isha</div><div class="p-time" id="time-Isha">--:--</div></div>
      </div>
      
      <div class="bottom-status">
        <div class="digital-clock" id="clock">12:34:56 PM</div>
        <div class="date-info">
          <div id="gregorian-date">---</div>
          <div id="hijri-date">---</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      city: 'Brooklyn',
      state: 'NY',
      country: 'US',
      method: 2 // ISNA
    };

    let prayerTimesToday = {};

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
      });
      updateCountdown();
    }

    async function fetchPrayerTimes() {
      try {
        const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${CONFIG.city}&state=${CONFIG.state}&country=${CONFIG.country}&method=${CONFIG.method}`);
        const data = await response.json();
        
        if (data.code === 200) {
          const timings = data.data.timings;
          const date = data.data.date;

          prayerTimesToday = {
            Fajr: timings.Fajr,
            Dhuhr: timings.Dhuhr,
            Asr: timings.Asr,
            Maghrib: timings.Maghrib,
            Isha: timings.Isha
          };

          document.getElementById('gregorian-date').innerText = date.readable;
          document.getElementById('hijri-date').innerText = `${date.hijri.day} ${date.hijri.month.en} ${date.hijri.year}`;

          for (let prayer in prayerTimesToday) {
            const element = document.getElementById(`time-${prayer}`);
            if (element) {
              element.innerText = formatTime12h(prayerTimesToday[prayer]);
            }
          }
        }
      } catch (error) {
        console.error("Error fetching prayer times:", error);
      }
    }

    function formatTime12h(time24) {
      const [hours, minutes] = time24.split(':');
      let h = parseInt(hours, 10);
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${minutes} ${ampm}`;
    }

    function updateCountdown() {
      if (Object.keys(prayerTimesToday).length === 0) return;

      const now = new Date();
      let nextPrayer = null;
      let nextPrayerTime = null;

      for (let prayer in prayerTimesToday) {
        const [h, m] = prayerTimesToday[prayer].split(':');
        const pTime = new Date();
        pTime.setHours(parseInt(h), parseInt(m), 0, 0);

        if (pTime > now) {
          nextPrayer = prayer;
          nextPrayerTime = pTime;
          break;
        }
      }

      if (!nextPrayer) {
        nextPrayer = 'Fajr';
        const [h, m] = prayerTimesToday['Fajr'].split(':');
        nextPrayerTime = new Date();
        nextPrayerTime.setDate(now.getDate() + 1);
        nextPrayerTime.setHours(parseInt(h), parseInt(m), 0, 0);
      }

      // Updated Compact Active Highlighting
      document.querySelectorAll('.p-item').forEach(item => item.classList.remove('active'));
      document.getElementById(`card-${nextPrayer}`).classList.add('active');
      document.getElementById('next-prayer-name').innerText = nextPrayer;

      const diff = nextPrayerTime - now;
      const hrs = Math.floor(diff / (1000 * 60 * 60));
      const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('countdown').innerText = 
        `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    setInterval(updateClock, 1000);
    fetchPrayerTimes();
    setInterval(fetchPrayerTimes, 1000 * 60 * 60 * 12);
  </script>
</body>
</html>
