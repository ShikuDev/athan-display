<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athan Clock Display</title>
  <style>
    :root {
      --bg-color: #f4efe6;
      --card-bg: #ffffff;
      --text-dark: #2c2a29;
      --text-muted: #736d6b;
      --accent-green: #0d9488;
      --accent-orange: #ea580c;
      --accent-red: #c2410c;
      --border-color: #e5decf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      /* Subtle geometric pattern overlay */
      background-image: radial-gradient(#dcd4c3 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-dark);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.5rem 3rem;
      overflow: hidden;
    }

    /* Top Section: Main Clock & Date */
    header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 1.5rem;
      padding: 1.5rem 2rem;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    .time {
      font-size: 6.5rem;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      color: var(--text-dark);
    }

    .date-container {
      margin-top: 0.75rem;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Middle Section: Next Prayer Countdown Badge */
    .next-prayer-banner {
      background: var(--card-bg);
      border: 2px solid var(--accent-orange);
      border-radius: 1.25rem;
      padding: 1rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.15);
    }

    .next-prayer-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-orange);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .countdown {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent-orange);
    }

    /* Bottom Section: Prayer Cards Grid */
    .prayer-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1.25rem;
    }

    .prayer-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 1.25rem;
      padding: 1.5rem 1rem;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
      transition: all 0.3s ease;
    }

    .prayer-card.active {
      background-color: var(--accent-green);
      color: #ffffff;
      border-color: var(--accent-green);
      transform: translateY(-4px);
      box-shadow: 0 12px 20px -5px rgba(13, 148, 136, 0.3);
    }

    .prayer-card.active .prayer-name {
      color: rgba(255, 255, 255, 0.9);
    }

    .prayer-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      letter-spacing: 0.5px;
    }

    .prayer-time {
      font-size: 1.8rem;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <header>
    <div class="time" id="clock">00:00:00 PM</div>
    <div class="date-container">
      <span id="gregorian-date">---</span> &nbsp;|&nbsp; <span id="hijri-date">---</span>
    </div>
  </header>

  <div class="next-prayer-banner">
    <div class="next-prayer-title">Next Prayer: <span id="next-prayer-name">--</span></div>
    <div class="countdown" id="countdown">00:00:00</div>
  </div>

  <div class="prayer-grid">
    <div class="prayer-card" id="card-Fajr">
      <div class="prayer-name">Fajr</div>
      <div class="prayer-time" id="time-Fajr">--:--</div>
    </div>
    <div class="prayer-card" id="card-Dhuhr">
      <div class="prayer-name">Dhuhr</div>
      <div class="prayer-time" id="time-Dhuhr">--:--</div>
    </div>
    <div class="prayer-card" id="card-Asr">
      <div class="prayer-name">Asr</div>
      <div class="prayer-time" id="time-Asr">--:--</div>
    </div>
    <div class="prayer-card" id="card-Maghrib">
      <div class="prayer-name">Maghrib</div>
      <div class="prayer-time" id="time-Maghrib">--:--</div>
    </div>
    <div class="prayer-card" id="card-Isha">
      <div class="prayer-name">Isha</div>
      <div class="prayer-time" id="time-Isha">--:--</div>
    </div>
  </div>

  <script>
    const CONFIG = {
      city: 'Brooklyn',
      state: 'NY',
      country: 'US',
      method: 2 // ISNA
    };

    let prayerTimesToday = {};

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
      });
      updateCountdown();
    }

    async function fetchPrayerTimes() {
      try {
        const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${CONFIG.city}&state=${CONFIG.state}&country=${CONFIG.country}&method=${CONFIG.method}`);
        const data = await response.json();
        
        if (data.code === 200) {
          const timings = data.data.timings;
          const date = data.data.date;

          prayerTimesToday = {
            Fajr: timings.Fajr,
            Dhuhr: timings.Dhuhr,
            Asr: timings.Asr,
            Maghrib: timings.Maghrib,
            Isha: timings.Isha
          };

          document.getElementById('gregorian-date').innerText = date.readable;
          document.getElementById('hijri-date').innerText = `${date.hijri.day} ${date.hijri.month.en} ${date.hijri.year}`;

          for (let prayer in prayerTimesToday) {
            const element = document.getElementById(`time-${prayer}`);
            if (element) {
              element.innerText = formatTime12h(prayerTimesToday[prayer]);
            }
          }
        }
      } catch (error) {
        console.error("Error fetching prayer times:", error);
      }
    }

    function formatTime12h(time24) {
      const [hours, minutes] = time24.split(':');
      let h = parseInt(hours, 10);
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${minutes} ${ampm}`;
    }

    function updateCountdown() {
      if (Object.keys(prayerTimesToday).length === 0) return;

      const now = new Date();
      let nextPrayer = null;
      let nextPrayerTime = null;

      for (let prayer in prayerTimesToday) {
        const [h, m] = prayerTimesToday[prayer].split(':');
        const pTime = new Date();
        pTime.setHours(parseInt(h), parseInt(m), 0, 0);

        if (pTime > now) {
          nextPrayer = prayer;
          nextPrayerTime = pTime;
          break;
        }
      }

      if (!nextPrayer) {
        nextPrayer = 'Fajr';
        const [h, m] = prayerTimesToday['Fajr'].split(':');
        nextPrayerTime = new Date();
        nextPrayerTime.setDate(now.getDate() + 1);
        nextPrayerTime.setHours(parseInt(h), parseInt(m), 0, 0);
      }

      document.querySelectorAll('.prayer-card').forEach(card => card.classList.remove('active'));
      document.getElementById(`card-${nextPrayer}`).classList.add('active');
      document.getElementById('next-prayer-name').innerText = nextPrayer;

      const diff = nextPrayerTime - now;
      const hrs = Math.floor(diff / (1000 * 60 * 60));
      const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('countdown').innerText = 
        `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    setInterval(updateClock, 1000);
    fetchPrayerTimes();
    setInterval(fetchPrayerTimes, 1000 * 60 * 60 * 12);
  </script>
</body>
</html>
