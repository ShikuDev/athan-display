<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athan Display</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #0ea5e9;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem;
      overflow: hidden;
    }

    /* Top Section: Date & Main Clock */
    header {
      text-align: center;
      margin-top: 1rem;
    }

    .time {
      font-size: 6.5rem;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
    }

    .date-container {
      margin-top: 0.5rem;
      font-size: 1.5rem;
      color: var(--text-sub);
    }

    /* Middle Section: Next Prayer Countdown Banner */
    .next-prayer-banner {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-radius: 1rem;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .next-prayer-title {
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .countdown {
      font-size: 2.2rem;
      font-weight: bold;
    }

    /* Bottom Section: 5 Daily Prayers Grid */
    .prayer-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
    }

    .prayer-card {
      background-color: var(--card-bg);
      border-radius: 0.75rem;
      padding: 1.2rem;
      text-align: center;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .prayer-card.active {
      border-color: var(--accent);
      background-color: #0f2b48;
    }

    .prayer-name {
      font-size: 1.25rem;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .prayer-time {
      font-size: 1.8rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="time" id="clock">00:00:00 PM</div>
    <div class="date-container">
      <span id="gregorian-date">---</span> • <span id="hijri-date">---</span>
    </div>
  </header>

  <div class="next-prayer-banner">
    <div class="next-prayer-title">Next Prayer: <span id="next-prayer-name">--</span></div>
    <div class="countdown" id="countdown">00:00:00</div>
  </div>

  <div class="prayer-grid">
    <div class="prayer-card" id="card-Fajr">
      <div class="prayer-name">Fajr</div>
      <div class="prayer-time" id="time-Fajr">--:--</div>
    </div>
    <div class="prayer-card" id="card-Dhuhr">
      <div class="prayer-name">Dhuhr</div>
      <div class="prayer-time" id="time-Dhuhr">--:--</div>
    </div>
    <div class="prayer-card" id="card-Asr">
      <div class="prayer-name">Asr</div>
      <div class="prayer-time" id="time-Asr">--:--</div>
    </div>
    <div class="prayer-card" id="card-Maghrib">
      <div class="prayer-name">Maghrib</div>
      <div class="prayer-time" id="time-Maghrib">--:--</div>
    </div>
    <div class="prayer-card" id="card-Isha">
      <div class="prayer-name">Isha</div>
      <div class="prayer-time" id="time-Isha">--:--</div>
    </div>
  </div>

  <script>
    // Configuration Settings
    const CONFIG = {
      city: 'Brooklyn',
      state: 'NY',
      country: 'US',
      method: 2 // ISNA (Islamic Society of North America)
    };

    let prayerTimesToday = {};

    // Live Clock Function
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
      });
      updateCountdown();
    }

    // Fetch Timings from Aladhan API
    async function fetchPrayerTimes() {
      try {
        const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${CONFIG.city}&state=${CONFIG.state}&country=${CONFIG.country}&method=${CONFIG.method}`);
        const data = await response.json();
        
        if (data.code === 200) {
          const timings = data.data.timings;
          const date = data.data.date;

          prayerTimesToday = {
            Fajr: timings.Fajr,
            Dhuhr: timings.Dhuhr,
            Asr: timings.Asr,
            Maghrib: timings.Maghrib,
            Isha: timings.Isha
          };

          // Display Gregorian and Hijri Date
          document.getElementById('gregorian-date').innerText = date.readable;
          document.getElementById('hijri-date').innerText = `${date.hijri.day} ${date.hijri.month.en} ${date.hijri.year}`;

          // Format and render prayer times
          for (let prayer in prayerTimesToday) {
            const element = document.getElementById(`time-${prayer}`);
            if (element) {
              element.innerText = formatTime12h(prayerTimesToday[prayer]);
            }
          }
        }
      } catch (error) {
        console.error("Error fetching prayer times:", error);
      }
    }

    // Convert 24-hour string (18:30) to 12-hour format (6:30 PM)
    function formatTime12h(time24) {
      const [hours, minutes] = time24.split(':');
      let h = parseInt(hours, 10);
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${minutes} ${ampm}`;
    }

    // Calculate Countdown & Highlight Next Prayer
    function updateCountdown() {
      if (Object.keys(prayerTimesToday).length === 0) return;

      const now = new Date();
      let nextPrayer = null;
      let nextPrayerTime = null;

      for (let prayer in prayerTimesToday) {
        const [h, m] = prayerTimesToday[prayer].split(':');
        const pTime = new Date();
        pTime.setHours(parseInt(h), parseInt(m), 0, 0);

        if (pTime > now) {
          nextPrayer = prayer;
          nextPrayerTime = pTime;
          break;
        }
      }

      // If all prayers today passed, next is Fajr tomorrow
      if (!nextPrayer) {
        nextPrayer = 'Fajr';
        const [h, m] = prayerTimesToday['Fajr'].split(':');
        nextPrayerTime = new Date();
        nextPrayerTime.setDate(now.getDate() + 1);
        nextPrayerTime.setHours(parseInt(h), parseInt(m), 0, 0);
      }

      // Update UI Active Card
      document.querySelectorAll('.prayer-card').forEach(card => card.classList.remove('active'));
      document.getElementById(`card-${nextPrayer}`).classList.add('active');
      document.getElementById('next-prayer-name').innerText = nextPrayer;

      // Calculate time remaining
      const diff = nextPrayerTime - now;
      const hrs = Math.floor(diff / (1000 * 60 * 60));
      const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('countdown').innerText = 
        `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // Initial Calls and Intervals
    setInterval(updateClock, 1000);
    fetchPrayerTimes();
    // Refresh API data daily at midnight
    setInterval(fetchPrayerTimes, 1000 * 60 * 60 * 12);
  </script>
</body>
</html>
